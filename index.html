<style>
/* 레이아웃: 첫 화면은 편지처럼(아치 사진 + 가로 문구), 그 아래는 시집처럼(표지 그림 띠 · 차례 · 명조 제목) */
:root{
  /* ── 색은 여기서만 바꾸면 사이트 전체가 바뀝니다 ── */
  --paper:#FBFAF6;     /* 기본 바탕 */
  --paper-2:#F2F0EA;   /* 구역 구분 바탕 */
  --white:#FFFFFF;
  --ink:#1F2633;       /* 글씨 */
  --ink-soft:#4A5060;  /* 보조 글씨 */
  --mute:#6B7080;
  --rule:#E3E0D6;      /* 가는 선 */
  --blue:#2B4A8B;      /* 포인트: 표지 그림의 파랑 */
  --blue-deep:#1E3B78;
  --rose-bg:#F6EFE9;   /* 첫 화면 바탕 */
  --rose:#97434F;      /* 첫 화면 포인트 */
  --rose-ink:#3B2F2C;
  --serif:"Nanum Myeongjo","Noto Serif KR",serif;
  --letter:"Gowun Batang","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.8;word-break:keep-all;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.narrow{max-width:680px;margin:0 auto;padding-inline:20px}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:12px;top:12px;background:var(--white);padding:8px 12px;z-index:99}

/* 머리글 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:72px}
.logo{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink)}
.logo b{font-family:var(--serif);font-weight:800;font-size:21px}
.logo span{font-family:var(--serif);font-size:11px;letter-spacing:.4em;color:var(--mute)}
nav.menu ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 20px}
nav.menu a{display:block;padding:8px 0;font-size:14.5px;text-decoration:none;color:var(--ink-soft);white-space:nowrap;border-bottom:2px solid transparent}
nav.menu a:hover{color:var(--ink)}
nav.menu a[aria-current="page"]{color:var(--blue);font-weight:700;border-bottom-color:var(--blue)}
.burger{display:none;background:none;border:1px solid var(--ink-soft);padding:9px 16px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
@media (max-width:1040px){
  .burger{display:block}
  nav.menu{position:fixed;inset:72px 0 auto 0;background:var(--paper);border-bottom:1px solid var(--rule);padding:6px 20px 18px;display:none;max-height:calc(100vh - 72px);overflow:auto}
  nav.menu.open{display:block}
  nav.menu ol{flex-direction:column;gap:0}
  nav.menu a{padding:14px 0;font-size:17px;border-bottom:1px solid var(--rule)}
  nav.menu a[aria-current="page"]{border-bottom-color:var(--rule)}
}

/* 공통 */
section{padding-block:clamp(60px,9vw,96px)}
section.alt{background:var(--paper-2)}
section.white{background:var(--white)}
.eyebrow{margin:0;font-size:13px;letter-spacing:.24em;color:var(--blue)}
h1,h2,h3{font-family:var(--serif);font-weight:800;text-wrap:balance;line-height:1.35;margin:0}

.lead{color:var(--ink-soft);max-width:36em}
.prose{max-width:36em;display:grid;gap:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 26px;background:var(--blue);color:#fff;text-decoration:none;font-weight:500;font-size:15.5px;border:1px solid var(--blue);cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:hover{background:var(--blue-deep)}
.btn.ghost:hover{background:var(--white)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.pending{border:1px dashed #C9C5B8;padding:24px 22px;color:var(--mute);font-size:15px;background:color-mix(in srgb,var(--white) 60%,transparent)}

.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}

.reveal{transition:opacity .8s ease,transform .8s ease}

/* HOME 첫 화면 (편지) */

.hero h1{font-family:var(--letter);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1.5}

/* 표지 그림 띠 */

/* 책 */
.book{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(32px,6vw,72px);align-items:center}
.book .cover{width:100%;max-width:360px;box-shadow:0 24px 48px -28px rgba(20,30,60,.55)}
.book .info{display:grid;gap:18px;min-width:0}
.book h2{font-size:clamp(32px,4vw,40px)}

.parts div{padding:14px 12px 0 0}

/* 편지(프롤로그 발췌) */
.letter{display:grid;gap:22px}
.letter p.l{font-family:var(--serif);font-size:clamp(18px,2.2vw,20px);line-height:2}
.letter .sign{text-align:right;font-family:var(--serif);color:var(--mute)}
blockquote.q{margin:0;font-family:var(--serif);font-size:clamp(19px,2.4vw,23px);line-height:1.9;padding-left:22px;border-left:2px solid var(--blue)}
blockquote.q cite{display:block;margin-top:10px;font-family:var(--sans);font-size:14px;font-style:normal;color:var(--mute)}

/* 차례 */
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px}

.toc span{font-size:14.5px;color:var(--mute);text-align:right}
.toc a:hover b{color:var(--blue)}
@media (max-width:760px){.toc{grid-template-columns:1fr}}

/* 문의 띠 */
.ask{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between}
.ask h2{font-size:28px}

/* 노선도 연표 */
.profile-top{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(32px,6vw,72px);align-items:start}
.profile-top img{width:100%;max-width:400px;aspect-ratio:3/4;object-fit:cover;object-position:50% 18%;border-radius:200px 200px 6px 6px}
@media (max-width:760px){.profile-top{grid-template-columns:1fr}.profile-top img{max-width:300px}}
.route{list-style:none;margin:0;padding:0;position:relative;max-width:720px}
.route::before{content:"";position:absolute;left:10px;top:12px;bottom:12px;width:2px;background:var(--blue)}
.route li{position:relative;padding:0 0 32px 48px}
.route li::before{content:"";position:absolute;left:2px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--paper-2);border:3px solid var(--blue)}
.route li.next::before{border-style:dashed}
.route li.next{color:var(--mute)}
.route .yr{font-size:13.5px;letter-spacing:.06em;color:var(--blue);font-variant-numeric:tabular-nums}
.route .yr.tbd{color:var(--mute)}
.route b{display:block;font-family:var(--serif);font-size:19px;font-weight:700;margin-top:2px}
.route p{color:var(--ink-soft);font-size:15.5px;margin-top:4px}
.facts h3{font-size:17px;margin-bottom:10px}
.facts ul{margin:0;padding-left:1.1em;color:var(--ink-soft)}

/* 표 */
.tbl{overflow-x:auto;border-top:1px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--rule)}
th{font-weight:500;color:var(--mute);font-size:13.5px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.topics{border-top:1px solid var(--ink)}
.topics div{padding:18px 0;border-bottom:1px solid var(--rule)}

/* 기록 */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{font:inherit;font-size:14.5px;min-height:40px;padding:6px 16px;border:1px solid var(--rule);background:var(--white);color:var(--ink-soft);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.years{margin-bottom:28px;display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--mute)}
.years select{font:inherit;font-size:14.5px;padding:6px 10px;border:1px solid var(--rule);background:var(--white);color:var(--ink)}
.news{display:grid;gap:0;border-top:1px solid var(--ink)}
.news article{padding:22px 0;border-bottom:1px solid var(--rule);display:grid;gap:6px}
.news .meta{font-size:13.5px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap}
.news .meta i{font-style:normal;color:var(--blue)}
.news h3{font-size:19px}

/* 유튜브 */
.ytframe{position:relative;width:100%;aspect-ratio:16/9;background:var(--ink);overflow:hidden}
.ytframe.big{max-width:900px}
.ytframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytlink{display:inline-block;margin-top:12px;font-size:14.5px;color:var(--blue)}
.ythead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:26px;max-width:900px}
.yt{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.yt a{text-decoration:none;display:grid;gap:10px}
.yt img{aspect-ratio:16/9;object-fit:cover;width:100%;background:var(--paper-2)}

/* 문의 */
form.contact{display:grid;gap:16px;max-width:620px}
form.contact label{display:grid;gap:6px;font-size:14.5px;color:var(--ink-soft)}
form.contact input,form.contact textarea{font:inherit;font-size:16px;padding:12px 14px;border:1px solid #CFCAbd;background:var(--white);color:var(--ink);width:100%}
form.contact textarea{min-height:160px;resize:vertical}
.types{display:flex;flex-wrap:wrap;gap:8px;border:0;padding:0;margin:0}
.types legend{font-size:14.5px;color:var(--ink-soft);margin-bottom:8px;padding:0}
.types label{display:inline-flex !important;flex-direction:row;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border:1px solid var(--rule);background:var(--white);cursor:pointer;color:var(--ink) !important}
.types input{width:auto !important;accent-color:var(--blue)}

.formmsg{padding:14px 16px;background:var(--paper-2);font-size:15px}
.contacts{display:grid;gap:18px;margin:0}
.contacts dt{font-size:13.5px;color:var(--mute)}
.contacts dd{margin:2px 0 0}

/* 푸터 */
footer{border-top:1px solid var(--rule);padding-block:40px 56px;font-size:13.5px;color:var(--mute)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:baseline}
</style>

</head>

<main id="main" tabindex="-1"><noscript><section><div class="narrow"><h1>손권희닷컴</h1><p class="lead" style="margin-top:14px">삶의 환승역을 이야기하는 사람, 손권희. 작가 · 전문청능사 · 강연가 · 부모교육가. 시집 『환승역』(북랩, 2026).</p><p style="margin-top:14px">이 사이트는 자바스크립트를 켜야 내용이 보입니다.</p></div></section></noscript></main>

<script>
/* =================================================================
   여기부터는 화면을 그리는 코드입니다. 고칠 필요 없습니다.
   ================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const br = s => esc(s).replace(/\n/g,"<br>");
const pending = (what, hint="") => `<div class="pending"><b>${esc(what)}</b> 준비 중입니다.${hint?`<br>${esc(hint)}`:""}</div>`;
const H2 = t => `<h2 class="st">${esc(t)}</h2>`;
const sub = (eb, t, lead="") => `<div class="subhead"><div class="wrap"><p class="eyebrow">${eb}</p><h1>${esc(t)}</h1>${lead?`<p class="lead">${lead}</p>`:""}</div></div>`;
const ytPlayer = (cls="") => YOUTUBE.channelId ? `<div class="ytframe ${cls}"><iframe src="https://www.youtube.com/embed/videoseries?list=UU${esc(YOUTUBE.channelId.slice(2))}" title="${esc(YOUTUBE.channelName)} 채널 최신 영상" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><a class="ytlink" href="${esc(YOUTUBE.channelUrl)}" target="_blank" rel="noopener">YouTube에서 ${esc(YOUTUBE.channelName)} 채널 보기 →</a>` : pending("YouTube 영상","채널 ID를 넣으면 최신 영상이 자동으로 보입니다.");
const ytId = u => (String(u).match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/)||[])[1];
const sortedArchive = () => [...ARCHIVE].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
const newsCards = list => `<div class="news">${list.map(a=>`<article><div class="meta"><i>${esc(a.type)}</i><span>${esc(a.media||"")}</span><span>${esc(a.date)}</span></div><h3>${esc(a.title)}</h3>${a.summary?`<p class="lead" style="font-size:15px">${esc(a.summary)}</p>`:""}${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener" style="color:var(--blue);font-size:14.5px">원문 보기 →</a>`:""}</article>`).join("")}</div>`;
const histTable = (rows, cols) => rows.length ? `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c[0]==='date'?'num':''}">${esc(r[c[0]])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : pending("이력", "날짜 · 기관 · 주제를 한 줄씩 추가하면 표가 생깁니다.");
const gallery = (p, what) => p.length ? `<div class="grid g3">${p.map(x=>`<img src="${esc(x.src)}" alt="${esc(x.alt)}" loading="lazy">`).join("")}</div>` : pending(what);
const ask = (type, label) => `<a class="btn" href="#contact" data-type="${esc(type)}">${esc(label)}</a>`;
const askBand = (title, text, type, label) => `<section class="white"><div class="wrap ask reveal"><div><h2>${esc(title)}</h2><p class="lead" style="margin-top:8px">${esc(text)}</p></div>${ask(type,label)}</div></section>`;

function renderArchive(){
  const box=$("#archList"); if(!box) return;
  const t=document.querySelector(".tabs [aria-pressed=true]")?.dataset.t||"전체";
  const y=$("#yearSel")?.value||"";
  const list=sortedArchive().filter(a=>(t==="전체"||a.type===t)&&(!y||String(a.date).startsWith(y)));
  box.innerHTML = list.length ? newsCards(list) : pending(t==="전체"?"기록":t, "항목을 한 줄씩 추가하면 카드가 자동으로 생깁니다.");
}

let wantedType="";
function render(){
  const id=(location.hash||"#home").slice(1);
  const page=PAGES[id]?id:"home";
  $("#main").innerHTML=PAGES[page]();
  document.querySelectorAll("#menuList a").forEach(a=>a.setAttribute("aria-current",a.dataset.id===page?"page":"false"));
  const md=document.querySelector('meta[name=description]'); if(md) md.content = page==="home" ? `${SITE.concept}. ${SITE.titles}.` : `${MENU.find(m=>m.id===page).label} | ${SITE.concept}`;
  document.title = page==="home" ? `${SITE.name} | ${SITE.english}` : `${MENU.find(m=>m.id===page).label} | ${SITE.name}`;
  if(page==="archive"){
    document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderArchive();});
    $("#yearSel").onchange=renderArchive; renderArchive();
  }
  if(page==="contact"){
    if(wantedType){const r=[...document.querySelectorAll('input[name=type]')].find(i=>i.value===wantedType); if(r) r.checked=true; wantedType="";}
    $("#cform").onsubmit=e=>{e.preventDefault();const m=$("#formMsg");
      if(!$("#fName").value.trim()||!$("#fMsg").value.trim()){m.hidden=false;m.textContent="이름과 문의 내용을 적어 주세요.";return;}
      m.hidden=false;m.textContent=CONTACT.formEndpoint?"보내는 중…":"문의 접수 방식이 아직 연결되지 않았습니다. 연결 후 이 버튼으로 바로 접수됩니다.";
      if(CONTACT.formEndpoint){fetch(CONTACT.formEndpoint,{method:"POST",body:new FormData(e.target),headers:{Accept:"application/json"}}).then(r=>{m.textContent=r.ok?"문의가 접수되었습니다. 확인 후 연락드리겠습니다.":"접수에 실패했습니다. 잠시 후 다시 보내 주세요.";if(r.ok)e.target.reset();}).catch(()=>m.textContent="접수에 실패했습니다. 잠시 후 다시 보내 주세요.");}
    };
  }
  window.scrollTo(0,0);
  $("#menu").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false");
  reveal();
}
function reveal(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!("IntersectionObserver" in window)) return;
  const els=[...document.querySelectorAll(".reveal")].filter(el=>el.getBoundingClientRect().top>innerHeight);
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target);}}),{rootMargin:"0px 0px -8% 0px"});
  els.forEach(el=>{el.classList.add("pre");io.observe(el);});
}

$("#menuList").innerHTML=MENU.map(m=>`<li><a href="#${m.id}" data-id="${m.id}">${esc(m.label)}</a></li>`).join("");
$("#foot").innerHTML=`<a class="logo" href="#home"><b>${esc(SITE.name)}</b><span>${esc(SITE.english)}</span></a>
  <span>${[CONTACT.email,CONTACT.phone].filter(Boolean).map(esc).join(" · ")}${CONTACT.youtube?`${CONTACT.email||CONTACT.phone?" · ":""}<a href="${esc(CONTACT.youtube)}" target="_blank" rel="noopener">YouTube</a>`:""}${CONTACT.instagram?` · <a href="${esc(CONTACT.instagram)}" target="_blank" rel="noopener">Instagram</a>`:""}</span>
  <span>© ${new Date().getFullYear()} ${esc(SITE.name)}</span>`;
document.addEventListener("click",e=>{const a=e.target.closest("a[data-type]"); if(a) wantedType=a.dataset.type;});
$("#burger").onclick=()=>{const o=$("#menu").classList.toggle("open");$("#burger").setAttribute("aria-expanded",o);};
const closeMenu=()=>{if($("#menu").classList.contains("open")){$("#menu").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");$("#burger").focus();}};
addEventListener("keydown",e=>{if(e.key==="Escape") closeMenu();});
document.addEventListener("click",e=>{if(!e.target.closest("#menu,#burger")) closeMenu();});
addEventListener("hashchange",render);
render();
</script>
